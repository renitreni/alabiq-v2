[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.d/www.conf
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log
user=www-data

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
startretries=3
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stderr_logfile=/var/log/queue-worker.err.log
stdout_logfile=/var/log/queue-worker.out.log
user=www-data

[program:schedule-worker]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/schedule-worker.err.log
stdout_logfile=/var/log/schedule-worker.out.log
user=www-data

[program:horizon]
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/horizon.err.log
stdout_logfile=/var/log/horizon.out.log
user=www-data